<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" role="img" aria-labelledby="title desc">
<title id="title">Hannah van Zanten | research card</title>
<desc id="desc">Original typographic research card for Hannah van Zanten, used where portrait reuse rights are not yet clear.</desc>
<rect width="960" height="1200" fill="#fcfaf6"/>
<circle cx="800" cy="160" r="250" fill="none" stroke="#d9d3c9" stroke-width="3"/>
<circle cx="110" cy="1100" r="190" fill="none" stroke="#d9d3c9" stroke-width="3"/>
<text x="72" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2c5f7c">WOMEN BEHIND THE SCIENCE</text>
<text x="72" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="210" font-weight="500" letter-spacing="-8" fill="#111111">HV</text>
<text x="72" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#111111"><tspan x="72" dy="0">Hannah van Zanten</tspan></text>
<text x="72" y="708" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#5d5a55">Farming systems ecology</text>
<text x="72" y="805" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="500" fill="#111111"><tspan x="72" dy="0">What should livestock do in a</tspan><tspan x="72" dy="42">circular food system?</tspan></text>
<text x="72" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#2c5f7c">EKO PERSPECTIVES</text>
</svg>