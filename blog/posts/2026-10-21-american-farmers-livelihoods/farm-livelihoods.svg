g><rect x="64" y="60" width="970" height="385" rx="8" fill="#fcfaf6" opacity=".95"/><text x="112" y="119" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#315f77" font-weight="700" letter-spacing="3">EKO PERSPECTIVES  /  ECONOMICS &amp; EVIDENCE</text><text x="110" y="213" font-family="Georgia,serif" font-size="61" fill="#222">America feeds its people.</text><text x="110" y="285" font-family="Georgia,serif" font-size="61" fill="#222">Who looks after its farmers?</text><path d="M112 324 H938" stroke="#d3cbbd" stroke-width="2"/><text x="112" y="374" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#555">Farm output, livelihoods and the limits of emergency relief</text><text x="112" y="411" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f77">ORIGINAL EDITORIAL ILLUSTRATION</text></svg>