<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Wildfire policy before, during and after fire</title>
<desc id="desc">A four-stage cycle showing prevention, preparedness, response and recovery. Prevention is emphasized and lists land-management actions such as grazing, thinning, firebreaks, access and water. The other stages show planning, firefighting and restoration.</desc>
<rect width="1600" height="900" fill="#fcfaf6"/>
<text x="800" y="74" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="700" fill="#181818">Wildfire policy begins long before ignition</text>
<text x="800" y="116" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="24" fill="#686660">Prevention, preparedness, response and recovery are parts of the same system.</text>

<rect x="85" y="185" width="665" height="550" rx="8" fill="#f4f2ed" stroke="#181818" stroke-width="3"/>
<text x="125" y="238" font-family="Montserrat, Arial, sans-serif" font-size="23" font-weight="700" fill="#2c5f7c">1 · PREVENTION</text>
<text x="125" y="280" font-family="Source Serif 4, Georgia, serif" font-size="28" fill="#181818">Manage the landscape while there is no fire.</text>
<g font-family="Montserrat, Arial, sans-serif" font-size="21" fill="#181818">
<circle cx="145" cy="345" r="8" fill="#2c5f7c"/><text x="170" y="353">appropriate grazing</text>
<circle cx="145" cy="400" r="8" fill="#2c5f7c"/><text x="170" y="408">thinning and vegetation management</text>
<circle cx="145" cy="455" r="8" fill="#2c5f7c"/><text x="170" y="463">maintained firebreaks</text>
<circle cx="145" cy="510" r="8" fill="#2c5f7c"/><text x="170" y="518">access routes and water points</text>
<circle cx="145" cy="565" r="8" fill="#2c5f7c"/><text x="170" y="573">coordination across neighbouring holdings</text>
</g>
<path d="M145 665 C245 610, 320 690, 430 635 S625 575, 710 625" fill="none" stroke="#8f8a7f" stroke-width="6"/>
<path d="M175 650 l30 -75 l30 75 z M245 655 l38 -95 l38 95 z M520 645 l28 -70 l28 70 z M590 650 l34 -88 l34 88 z" fill="#486b43"/>
<text x="125" y="705" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#686660">Land-management choices shape fuel, access and exposure.</text>

<rect x="805" y="185" width="710" height="550" rx="8" fill="#fcfaf6" stroke="#181818" stroke-width="2"/>
<line x1="805" y1="368" x2="1515" y2="368" stroke="#181818" stroke-width="1"/>
<line x1="805" y1="552" x2="1515" y2="552" stroke="#181818" stroke-width="1"/>

<text x="850" y="235" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c5f7c">2 · PREPAREDNESS</text>
<text x="850" y="276" font-family="Source Serif 4, Georgia, serif" font-size="27" fill="#181818">Plan for the fire before it arrives.</text>
<text x="850" y="320" font-family="Montserrat, Arial, sans-serif" font-size="19" fill="#686660">Fire plans · alerts · equipment · routes · neighbour coordination</text>

<text x="850" y="417" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c5f7c">3 · RESPONSE</text>
<text x="850" y="458" font-family="Source Serif 4, Georgia, serif" font-size="27" fill="#181818">Protect people, property and ecosystems.</text>
<path d="M1375 470 C1345 430 1380 405 1360 375 C1415 405 1445 455 1420 500 C1400 535 1340 535 1320 495 C1308 472 1320 445 1340 425 C1345 458 1360 470 1375 470 Z" fill="#b46b50"/>
<text x="850" y="505" font-family="Montserrat, Arial, sans-serif" font-size="19" fill="#686660">Detection · suppression · evacuation · emergency access</text>

<text x="850" y="603" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c5f7c">4 · RECOVERY</text>
<text x="850" y="644" font-family="Source Serif 4, Georgia, serif" font-size="27" fill="#181818">Restore, learn and reduce the next risk.</text>
<text x="850" y="690" font-family="Montserrat, Arial, sans-serif" font-size="19" fill="#686660">Erosion control · habitat recovery · rebuilding · review</text>

<path d="M1490 748 C1490 805, 1420 830, 1340 830 L250 830 C165 830, 110 805, 110 748" fill="none" stroke="#2c5f7c" stroke-width="4"/>
<polygon points="110,748 95,776 125,776" fill="#2c5f7c"/>
<text x="800" y="858" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="20" fill="#686660">Recovery feeds back into prevention. The cycle is continuous.</text>
</svg>