<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">US farm relief announcements, 2025 and 2026</title><desc id="desc">EKO Perspectives editorial diagram comparing $12 billion in Farmer Bridge Assistance announced December 2025 and $8 billion in Harvest Fuel Relief announced October 2026, with the question of payment targeting.</desc><rect width="1600" height="900" fill="#fcfaf6"/><rect x="85" y="75" width="1430" height="740" rx="12" fill="none" stroke="#d6cfc3" stroke-width="2"/><text x="140" y="155" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="3" fill="#2c5f7c">EKO PERSPECTIVES  /  POLICY &amp; EVIDENCE</text><text x="140" y="245" font-family="Georgia,serif" font-size="66" fill="#191919">Another US farm relief package</text><text x="140" y="306" font-family="Georgia,serif" font-size="37" fill="#52514e">Two announcements, one difficult question about targeting</text><line x1="140" y1="360" x2="1460" y2="360" stroke="#c9c1b4" stroke-width="2"/><text x="145" y="496" font-family="Georgia,serif" font-size="132" fill="#2c5f7c">$12bn</text><text x="145" y="554" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#191919">Farmer Bridge Assistance</text><text x="145" y="600" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#65615d">Announced December 2025</text><line x1="805" y1="407" x2="805" y2="655" stroke="#d6cfc3" stroke-width="2"/><text x="875" y="496" font-family="Georgia,serif" font-size="132" fill="#2c5f7c">$8bn</text><text x="875" y="554" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#191919">Harvest Fuel Relief</text><text x="875" y="600" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#65615d">Announced October 2026</text><line x1="140" y1="683" x2="1460" y2="683" stroke="#c9c1b4" stroke-width="2"/><text x="140" y="740" font-family="Georgia,serif" font-size="35" fill="#191919">National modelled losses are not individual farm fuel bills.</text><text x="140" y="785" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#666">Source: USDA announcements 2025–2026  •  Original EKO graphic</text></svg>