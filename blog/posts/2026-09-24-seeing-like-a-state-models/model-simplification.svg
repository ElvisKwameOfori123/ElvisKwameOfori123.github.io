<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">From a complex landscape to a simplified model</title>
<desc id="desc">A split-panel schematic. The left side shows an irregular landscape with fields, a stream, woodland, roads and farm buildings. An arrow labelled simplify points to a neat grid on the right with a small set of categories. A note below says that the model gains clarity by leaving detail out.</desc>
<rect width="1600" height="900" fill="#fcfaf6"/>
<text x="800" y="72" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="700" fill="#181818">A model makes the world legible by leaving things out</text>
<text x="800" y="112" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="24" fill="#686660">The simplification can be useful and still be incomplete.</text>

<rect x="85" y="170" width="610" height="540" rx="6" fill="#f4f2ed" stroke="#181818" stroke-width="2"/>
<text x="120" y="220" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c5f7c">THE LANDSCAPE</text>

<path d="M105 575 C220 520, 310 625, 415 555 S590 470, 675 520" fill="none" stroke="#2c5f7c" stroke-width="18" stroke-linecap="round"/>
<path d="M105 330 L270 255 L350 335 L270 455 L120 420 Z" fill="#e5dfcf" stroke="#686660" stroke-width="2"/>
<path d="M300 245 L490 220 L575 330 L470 425 L350 335 Z" fill="#d9e1d2" stroke="#686660" stroke-width="2"/>
<path d="M120 445 L275 470 L355 600 L190 680 L105 575 Z" fill="#efe6cf" stroke="#686660" stroke-width="2"/>
<path d="M365 445 L520 430 L675 520 L590 675 L395 620 Z" fill="#ded8c8" stroke="#686660" stroke-width="2"/>
<circle cx="545" cy="300" r="18" fill="#486b43"/>
<circle cx="578" cy="285" r="16" fill="#486b43"/>
<circle cx="610" cy="316" r="20" fill="#486b43"/>
<circle cx="560" cy="335" r="15" fill="#486b43"/>
<circle cx="625" cy="350" r="17" fill="#486b43"/>
<rect x="202" y="515" width="54" height="38" fill="#b46b50"/>
<polygon points="195,515 229,487 263,515" fill="#6d5145"/>
<rect x="442" y="500" width="62" height="42" fill="#b46b50"/>
<polygon points="434,500 473,468 512,500" fill="#6d5145"/>
<path d="M135 282 C230 360, 285 205, 400 300 S565 410, 660 250" fill="none" stroke="#8f8a7f" stroke-width="8" stroke-dasharray="20 14"/>
<text x="120" y="750" font-family="Source Serif 4, Georgia, serif" font-size="23" fill="#181818">Soil, access, ownership, labour, water, habitat, roads, history...</text>

<line x1="735" y1="435" x2="855" y2="435" stroke="#2c5f7c" stroke-width="5"/>
<polygon points="855,435 825,417 825,453" fill="#2c5f7c"/>
<text x="795" y="400" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c5f7c">SIMPLIFY</text>

<rect x="905" y="170" width="610" height="540" rx="6" fill="#f4f2ed" stroke="#181818" stroke-width="2"/>
<text x="940" y="220" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c5f7c">THE MODEL</text>
<g stroke="#686660" stroke-width="2">
<rect x="960" y="270" width="150" height="120" fill="#e5dfcf"/>
<rect x="1110" y="270" width="150" height="120" fill="#d9e1d2"/>
<rect x="1260" y="270" width="150" height="120" fill="#efe6cf"/>
<rect x="960" y="390" width="150" height="120" fill="#d9e1d2"/>
<rect x="1110" y="390" width="150" height="120" fill="#e5dfcf"/>
<rect x="1260" y="390" width="150" height="120" fill="#d9e1d2"/>
<rect x="960" y="510" width="150" height="120" fill="#efe6cf"/>
<rect x="1110" y="510" width="150" height="120" fill="#efe6cf"/>
<rect x="1260" y="510" width="150" height="120" fill="#e5dfcf"/>
</g>
<text x="1035" y="338" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">DAIRY</text>
<text x="1185" y="338" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">BEEF</text>
<text x="1335" y="338" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">TILLAGE</text>
<text x="1035" y="458" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">BEEF</text>
<text x="1185" y="458" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">DAIRY</text>
<text x="1335" y="458" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">BEEF</text>
<text x="1035" y="578" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">TILLAGE</text>
<text x="1185" y="578" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">TILLAGE</text>
<text x="1335" y="578" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#181818">DAIRY</text>
<text x="940" y="750" font-family="Source Serif 4, Georgia, serif" font-size="23" fill="#181818">Clearer categories. Fewer details. A claim with defined limits.</text>

<line x1="130" y1="814" x2="1470" y2="814" stroke="#181818" stroke-width="2"/>
<text x="800" y="855" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="20" fill="#686660">The discipline is not to avoid simplification, but to remember what disappeared.</text>
</svg>