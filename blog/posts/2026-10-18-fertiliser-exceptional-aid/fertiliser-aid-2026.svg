<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Ireland's 2026 fertiliser aid formula</title><desc id="d">Payment rate of 40 euro per eligible tonne, minimum 2.5 tonnes, and maximum 100 tonnes supported.</desc><rect width="1200" height="675" fill="#fcfaf6"/><rect x="54" y="54" width="1092" height="567" rx="10" fill="none" stroke="#ddd6ca" stroke-width="2"/><text x="100" y="122" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="2" fill="#2c5f7c">EKO PERSPECTIVES / AGRICULTURE</text><text x="100" y="202" font-family="Georgia,serif" font-size="53" fill="#171717">Fertiliser Exceptional Aid, 2026</text><text x="100" y="257" font-family="Arial,sans-serif" font-size="27" fill="#555">What the announced payment formula means</text><line x1="100" y1="297" x2="1100" y2="297" stroke="#c7bfb0" stroke-width="2"/><text x="110" y="375" font-family="Georgia,serif" font-size="75" fill="#2c5f7c">€40</text><text x="110" y="419" font-family="Arial,sans-serif" font-size="23" fill="#555">per eligible tonne</text><text x="458" y="375" font-family="Georgia,serif" font-size="75" fill="#171717">2.5 t</text><text x="458" y="419" font-family="Arial,sans-serif" font-size="23" fill="#555">minimum quantity</text><text x="821" y="375" font-family="Georgia,serif" font-size="75" fill="#171717">100 t</text><text x="821" y="419" font-family="Arial,sans-serif" font-size="23" fill="#555">maximum supported</text><line x1="100" y1="469" x2="1100" y2="469" stroke="#c7bfb0" stroke-width="2"/><text x="110" y="535" font-family="Georgia,serif" font-size="35" fill="#171717">€100 minimum  ·  €4,000 maximum</text><text x="110" y="579" font-family="Arial,sans-serif" font-size="22" fill="#666">Database record extract: 23 October 2026</text></svg>