<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">A simplified view of the MAgPIE modelling architecture</title>
<desc id="desc">Demand and scenario assumptions plus biophysical constraints enter an optimisation model, which produces land-use patterns, yields and production costs.</desc>
<rect width="1200" height="630" fill="#fffaf4"/>
<text x="80" y="90" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#173b57">How MAgPIE frames a land-system problem</text>
<line x1="80" y1="120" x2="1120" y2="120" stroke="#d7cfc6" stroke-width="2"/>
<text x="90" y="205" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#762844">INPUTS</text>
<rect x="90" y="235" width="260" height="105" fill="#ffffff" stroke="#173b57" stroke-width="2"/>
<text x="120" y="275" font-family="Arial, sans-serif" font-size="24" fill="#243442">Demand &amp; scenarios</text>
<text x="120" y="310" font-family="Arial, sans-serif" font-size="18" fill="#68757d">food, timber, bioenergy</text>
<rect x="90" y="375" width="260" height="105" fill="#ffffff" stroke="#173b57" stroke-width="2"/>
<text x="120" y="415" font-family="Arial, sans-serif" font-size="24" fill="#243442">Biophysical limits</text>
<text x="120" y="450" font-family="Arial, sans-serif" font-size="18" fill="#68757d">yields, land, water</text>
<line x1="350" y1="287" x2="500" y2="315" stroke="#2f735c" stroke-width="4"/>
<polygon points="500,315 482,303 484,326" fill="#2f735c"/>
<line x1="350" y1="427" x2="500" y2="355" stroke="#2f735c" stroke-width="4"/>
<polygon points="500,355 479,352 488,373" fill="#2f735c"/>
<rect x="500" y="245" width="260" height="170" fill="#f7f1ea" stroke="#762844" stroke-width="3"/>
<text x="630" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#762844">MAgPIE</text>
<text x="630" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#243442">optimisation</text>
<text x="630" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#68757d">minimise system cost</text>
<line x1="760" y1="330" x2="900" y2="330" stroke="#2f735c" stroke-width="4"/>
<polygon points="900,330 880,318 880,342" fill="#2f735c"/>
<text x="920" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#762844">OUTPUTS</text>
<text x="920" y="295" font-family="Arial, sans-serif" font-size="24" fill="#243442">Land-use patterns</text>
<text x="920" y="340" font-family="Arial, sans-serif" font-size="24" fill="#243442">Yields</text>
<text x="920" y="385" font-family="Arial, sans-serif" font-size="24" fill="#243442">Production costs</text>
<text x="90" y="555" font-family="Georgia, serif" font-size="24" fill="#243442">The useful idea is architectural: keep the assumptions modular, then let the model reconcile them.</text>
</svg>