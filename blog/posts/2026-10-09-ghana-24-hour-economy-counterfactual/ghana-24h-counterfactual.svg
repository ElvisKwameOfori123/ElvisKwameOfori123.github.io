<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How to evaluate Ghana's 24H+ programme</title>
  <desc id="desc">A diagram comparing the observed path after the 24H+ programme with the estimated counterfactual path without the programme. Their difference is the policy impact. Outcomes listed are output, jobs, productivity and exports.</desc>
  <rect width="1600" height="900" fill="#fcfaf6"/>
  <text x="120" y="135" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#111111">The missing line in a 24H+ scorecard</text>
  <text x="120" y="192" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#666666">Observed change is not automatically the effect of the programme</text>

  <line x1="180" y1="640" x2="1420" y2="640" stroke="#cfc8bd" stroke-width="3"/>
  <line x1="330" y1="270" x2="330" y2="690" stroke="#cfc8bd" stroke-width="3"/>
  <text x="275" y="730" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#666666">24H+ begins</text>

  <path d="M 180 585 C 260 555, 300 520, 330 500 C 520 420, 760 330, 1030 260 C 1190 220, 1320 195, 1420 180"
        fill="none" stroke="#2c5f7c" stroke-width="8"/>
  <path d="M 180 585 C 260 555, 300 520, 330 500 C 530 465, 760 430, 1030 405 C 1200 390, 1325 380, 1420 370"
        fill="none" stroke="#77716a" stroke-width="6" stroke-dasharray="14 12"/>

  <text x="1050" y="235" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#2c5f7c">Observed after 24H+</text>
  <text x="1050" y="445" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#666666">Estimated without 24H+</text>

  <line x1="930" y1="302" x2="930" y2="420" stroke="#111111" stroke-width="3"/>
  <polygon points="920,312 940,312 930,294" fill="#111111"/>
  <polygon points="920,410 940,410 930,428" fill="#111111"/>
  <text x="955" y="365" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" fill="#111111">policy impact</text>

  <rect x="170" y="770" width="1260" height="70" rx="5" fill="#f5f1e9"/>
  <text x="210" y="815" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#111111">Track: output   •   jobs   •   productivity   •   wages   •   exports   •   capacity utilisation</text>
  <text x="120" y="870" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1.8" fill="#2c5f7c">EKO PERSPECTIVES</text>
</svg>