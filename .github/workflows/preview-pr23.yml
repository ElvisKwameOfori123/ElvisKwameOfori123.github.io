name: Preview PR23 final consolidation

on:
  pull_request:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture responsive screenshots
        run: |
          python3 -m http.server 8000 --directory _site >/tmp/eko-pr23-http.log 2>&1 &
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true});
          const pages = [
            ['acres','/blog/posts/2026-09-22-acres-landscape-actions/'],
            ['ai','/blog/posts/2026-09-22-ai-needs-evidence-not-anecdotes/'],
            ['wildfire','/blog/posts/2026-09-24-wildfire-policy-before-fire/'],
            ['how','/how-i-got-here/']
          ];
          const widths = [['phone',375,812],['desktop',1440,1100]];
          fs.mkdirSync('visual-preview',{recursive:true});
          const results=[];
          for (const [name,path] of pages) {
            for (const [size,width,height] of widths) {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:8000'+path,{waitUntil:'networkidle'});
              const data=await page.evaluate(()=>({
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                title:document.querySelector('h1')?.textContent?.trim() || '',
                imageCount:[...document.querySelectorAll('main img')].filter(img=>{const r=img.getBoundingClientRect();const s=getComputedStyle(img);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';}).length
              }));
              if(data.overflow) throw new Error(`${name} overflows horizontally at ${size}`);
              results.push({name,size,...data});
              await page.screenshot({path:`visual-preview/${name}-${size}.png`,fullPage:true});
              await page.close();
            }
          }
          fs.writeFileSync('visual-preview/results.json',JSON.stringify(results,null,2));
          await browser.close();
          JS
          node capture.mjs

      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: pr23-final-consolidation-preview
          path: visual-preview
          if-no-files-found: error
