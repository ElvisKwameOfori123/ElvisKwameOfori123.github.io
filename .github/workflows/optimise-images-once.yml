name: Optimise site images once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/optimise-images-once.yml

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Optimise oversized JPEG photographs
        run: python tools/optimise_images.py

      - name: Correct image descriptions and profile alt text
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("blog/posts/2026-10-02-one-hectare-many-promises/index.qmd"): [
                  (
                      'image-alt: "Rows of green crops growing beneath elevated solar panels in an agrivoltaic research field, showing agriculture and energy production sharing the same land"',
                      'image-alt: "A group of researchers, most wearing face masks, standing in a row on bare ground at a UC Davis agrivoltaics field site, with low solar panels and green crops behind them under a hazy sky"',
                  ),
                  (
                      '![Crops growing beneath solar panels in an agrivoltaic research field.](agrivoltaics-land-use.jpg){fig-alt="Rows of green crops growing beneath elevated solar panels in an agrivoltaic research field, showing agriculture and energy production sharing the same land." width="100%" fig-align="center"}',
                      '![Researchers at a UC Davis agrivoltaics field site, where crops are grown among solar panels.](agrivoltaics-land-use.jpg){fig-alt="A group of researchers, most wearing face masks, standing in a row on bare ground at a UC Davis agrivoltaics field site, with low solar panels and green crops behind them under a hazy sky." width="100%" fig-align="center"}',
                  ),
              ],
              Path("index.qmd"): [
                  (
                      'alt="Rows of green crops growing beneath elevated solar panels, showing agriculture and energy production sharing the same land"',
                      'alt="A group of researchers, most wearing face masks, standing in a row on bare ground at a UC Davis agrivoltaics field site, with low solar panels and green crops behind them under a hazy sky"',
                  ),
              ],
              Path("how-i-got-here/index.qmd"): [
                  (
                      '![Elvis Kwame Ofori standing outdoors in a patterned cardigan.](../assets/profile.jpg){width=72% fig-align="center"}',
                      '![Elvis Kwame Ofori standing outdoors in a patterned cardigan.](../assets/profile.jpg){fig-alt="Elvis Kwame Ofori standing outdoors in a patterned cardigan." width=72% fig-align="center"}',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit optimised images and accessibility fixes
        run: |
          git config user.name "ElvisKwameOfori123"
          git config user.email "113311989+ElvisKwameOfori123@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Optimise oversized photographs and correct image descriptions"
            git push
          fi
