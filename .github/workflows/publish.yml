on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Render and Publish Quarto site

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so the sitemap can date each page from its last commit.
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned to the release the live site is tested on. Upgrade
          # deliberately: render, run the site-health audit, then bump.
          version: 1.10.19

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
