name: Check site links

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Audit rendered crawl and canonical health
        run: python scripts/site-health-audit.py

      - name: Upload site-health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health-report
          path: ./site-health-report.md
          if-no-files-found: error
          retention-days: 14

      # EUR-Lex commonly returns HTTP 202 to automated clients even when the
      # document is valid and browser-accessible, so 202 is accepted here.
      # Yale University Press sometimes serves the verified Seeing Like a
      # State URL as 404 to automated link checkers, so only that exact URL
      # is excluded. The page is checked manually before keeping this rule.
      # journal.societyofirishforesters.ie is excluded because its TLS
      # certificate expired in December 2025; the links are correct primary
      # sources. Remove the exclusion once the journal renews its certificate.
      - name: Check rendered links
        id: lychee
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: >-
            --no-progress
            --root-dir ./_site
            --max-retries 2
            --timeout 20
            --accept 200,202,204,206,403,429
            --exclude '^https://www\.linkedin\.com/'
            --exclude '^https://kwameofori123\.com/'
            --exclude '^https://yalebooks\.yale\.edu/book/9780300078152/seeing-like-a-state/?$'
            --exclude '^https://journal\.societyofirishforesters\.ie/'
            './_site/**/*.html'
          format: markdown
          output: ./lychee-report.md
          jobSummary: true
          fail: true

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: ./lychee-report.md
          if-no-files-found: ignore
          retention-days: 14
