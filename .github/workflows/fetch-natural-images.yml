name: Fetch natural editorial images

on:
  push:
    branches:
      - natural-documentary-leads
    paths:
      - .github/workflows/fetch-natural-images.yml

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: natural-documentary-leads

      - name: Download and prepare images
        run: |
          python -m pip install --quiet pillow
          mkdir -p blog/posts/2026-09-22-acres-landscape-actions
          mkdir -p blog/posts/2026-09-24-seeing-like-a-state-models
          mkdir -p blog/posts/2026-09-24-wildfire-policy-before-fire

          curl -L --fail --retry 3             "https://upload.wikimedia.org/wikipedia/commons/6/6e/Agricultural_Landscape_Co_Dublin_-_geograph.org.uk_-_1721182.jpg"             -o /tmp/acres.jpg

          curl -L --fail --retry 3             "https://upload.wikimedia.org/wikipedia/commons/5/56/Ordnance_Survey_Ireland_Six-inch_Donegal_Sheet_15_Dunfanaghy%2C_Published_1905.jpg"             -o /tmp/map.jpg

          curl -L --fail --retry 3             "https://upload.wikimedia.org/wikipedia/commons/e/e9/I_love_the_smell_of_burning_gorse_in_the_morning._-_geograph.org.uk_-_1930711.jpg"             -o /tmp/fire.jpg

          python - <<'PY'
          from PIL import Image, ImageOps
          Image.MAX_IMAGE_PIXELS = None
          jobs = [
              ("/tmp/acres.jpg","blog/posts/2026-09-22-acres-landscape-actions/acres-irish-landscape.jpg",1200),
              ("/tmp/map.jpg","blog/posts/2026-09-24-seeing-like-a-state-models/os-ireland-map-1905.jpg",1800),
              ("/tmp/fire.jpg","blog/posts/2026-09-24-wildfire-policy-before-fire/cork-gorse-burning.jpg",1600),
          ]
          for src,dst,maxw in jobs:
              im=Image.open(src).convert("RGB")
              if im.width > maxw:
                  h=round(im.height*maxw/im.width)
                  im=im.resize((maxw,h),Image.Resampling.LANCZOS)
              im.save(dst,"JPEG",quality=86,optimize=True,progressive=True)
              print(dst, im.size)
          PY

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts/2026-09-22-acres-landscape-actions/acres-irish-landscape.jpg
          git add blog/posts/2026-09-24-seeing-like-a-state-models/os-ireland-map-1905.jpg
          git add blog/posts/2026-09-24-wildfire-policy-before-fire/cork-gorse-burning.jpg
          git commit -m "Add documentary lead images"
          git push origin HEAD:natural-documentary-leads
