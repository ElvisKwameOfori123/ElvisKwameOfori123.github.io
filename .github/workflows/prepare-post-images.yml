name: Prepare local post images

on:
  push:
    branches:
      - post-images-2026-09-23

permissions:
  contents: write

jobs:
  prepare-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: post-images-2026-09-23

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --quiet pillow requests

      - name: Optimise and localise images
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import requests
          from io import BytesIO

          fusion_dir = Path("blog/posts/2026-09-22-fusion-foresight")
          fusion_png = fusion_dir / "foresight1.png"
          fusion_jpg = fusion_dir / "foresight1.jpg"

          with Image.open(fusion_png) as im:
              im = im.convert("RGB")
              im.save(fusion_jpg, "JPEG", quality=82, optimize=True, progressive=True)

          fusion_qmd = fusion_dir / "index.qmd"
          text = fusion_qmd.read_text(encoding="utf-8")
          text = text.replace('src="foresight1.png"', 'src="foresight1.jpg"')
          fusion_qmd.write_text(text, encoding="utf-8")

          econ_dir = Path("blog/posts/2026-09-22-econometrics-to-scenario-thinking")
          econ_jpg = econ_dir / "irish-farm-field.jpg"
          url = "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Irish_Farm_Field_%2838665262%29.jpeg/1024px-Irish_Farm_Field_%2838665262%29.jpeg"
          response = requests.get(url, timeout=60, headers={"User-Agent": "EKO-Perspectives-image-localiser/1.0"})
          response.raise_for_status()

          with Image.open(BytesIO(response.content)) as im:
              im = im.convert("RGB")
              if im.width > 1024:
                  ratio = 1024 / im.width
                  im = im.resize((1024, round(im.height * ratio)), Image.Resampling.LANCZOS)
              im.save(econ_jpg, "JPEG", quality=82, optimize=True, progressive=True)

          econ_qmd = econ_dir / "index.qmd"
          text = econ_qmd.read_text(encoding="utf-8")
          text = text.replace(
              'image: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Irish_Farm_Field_%2838665262%29.jpeg/1024px-Irish_Farm_Field_%2838665262%29.jpeg"',
              'image: "irish-farm-field.jpg"'
          )
          text = text.replace(
              '](<https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Irish_Farm_Field_%2838665262%29.jpeg/1024px-Irish_Farm_Field_%2838665262%29.jpeg>)',
              '](irish-farm-field.jpg)'
          )
          econ_qmd.write_text(text, encoding="utf-8")

          for path in (fusion_jpg, econ_jpg):
              size_kb = path.stat().st_size / 1024
              print(f"{path}: {size_kb:.1f} KB")
              if size_kb > 220:
                  raise SystemExit(f"{path} is still too large: {size_kb:.1f} KB")

      - name: Commit prepared images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm blog/posts/2026-09-22-fusion-foresight/foresight1.png
          git add blog/posts/2026-09-22-fusion-foresight/foresight1.jpg
          git add blog/posts/2026-09-22-fusion-foresight/index.qmd
          git add blog/posts/2026-09-22-econometrics-to-scenario-thinking/irish-farm-field.jpg
          git add blog/posts/2026-09-22-econometrics-to-scenario-thinking/index.qmd
          git commit -m "Optimise and localise post images"
          git push origin HEAD:post-images-2026-09-23
