name: Apply final EKO consolidation

on:
  push:
    branches:
      - eko-final-consolidation
    paths:
      - .github/workflows/apply-final-consolidation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: eko-final-consolidation

      - name: Apply editorial consolidation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1. Restore clear, proportionate judgements in the three reviewed posts.
          replace_once(
              'blog/posts/2026-09-22-acres-landscape-actions/index.qmd',
              "Economists will recognise the shape of this. Part of the benefit produced on one farm spills over to other farms and to the public, so the private incentive to provide it can fall short of its social value. Agri-environment payments already try to close some of that gap. Landscape coordination adds a harder problem, because the value of one farmer's action may depend on whether neighbours act too.",
              "Economists will recognise the shape of this. Part of the benefit produced on one farm spills over to other farms and to the public, so the private incentive to provide it falls short of its social value. Agri-environment payments already try to close some of that gap. Landscape coordination adds a harder problem, because the value of one farmer's action may depend on whether neighbours act too."
          )
          replace_once(
              'blog/posts/2026-09-22-acres-landscape-actions/index.qmd',
              "My preference is therefore not for landscape contracts everywhere, but for starting at the scale of the environmental process. Where outcomes depend on flows or connectivity across holdings, such as catchment water quality or habitat networks, scheme design should begin with the catchment or landscape and then decide what can sensibly be delivered through individual farm contracts. Where the outcome genuinely sits within one field or holding, farm-level design may be enough. That distinction seems more useful than choosing one scale as a rule for every problem.",
              "My preference is to start at the scale of the environmental process. Where outcomes depend on flows or connections across holdings, such as catchment water quality or habitat networks, scheme design should begin with the catchment or landscape and only then decide what individual farm contracts can deliver. Where the outcome sits within one field or holding, farm-level design is enough."
          )
          replace_once(
              'blog/posts/2026-09-22-ai-needs-evidence-not-anecdotes/index.qmd',
              "I am therefore cautious with studies that reduce exposure to time spent with a tool or mere access to it, especially when they do not record how the system was used. Those measures can still tell us something, but they cannot distinguish between AI replacing an attempt, supplying feedback after an attempt, or supporting revision. Studies that capture the pattern of use give us a better chance of understanding the mechanism. The same applies to outcomes: exam performance, long-term retention, writing quality, confidence, reasoning and time saved are not interchangeable measures of learning.",
              "I put little weight on studies that measure exposure only as time spent with a tool or access to it. Those measures cannot tell AI replacing an attempt from AI giving feedback after one, or from AI supporting revision. Studies that capture the pattern of use give us a better chance of understanding the mechanism. The same applies to outcomes: exam performance, long-term retention, writing quality, confidence, reasoning and time saved are not interchangeable measures of learning."
          )
          replace_once(
              'blog/posts/2026-09-24-wildfire-policy-before-fire/index.qmd',
              "By the time a hillside is burning, many of those choices have already been made, but that makes prevention and emergency response parts of the same system rather than substitutes for one another.",
              "By the time a hillside is burning, many of the choices that shaped the risk were made long before, mostly by people who were not thinking about fire. Prevention and response are parts of one system."
          )

          # 2. Replace How I got here with a tighter combined version.
          how = r'''---
title: "How I got here"
subtitle: "A living account of the places, people and opportunities that shaped the work I do."
description: "From Ghana to China and Ireland: the people, opportunities, detours and questions that shaped Elvis Kwame Ofori's work and writing."
toc: true
image: "../assets/profile.jpg"
image-alt: "Elvis Kwame Ofori standing outdoors in a patterned cardigan"
---

![Elvis Kwame Ofori standing outdoors in a patterned cardigan.](../assets/profile.jpg){width=72% fig-align="center"}

I studied accounting in Ghana, taught English in China, and now build agricultural and land-use models in Ireland. None of those sentences would have predicted the next one while I was living it. Looking back can make a life seem more carefully planned than it was. Mine was not. There were opportunities I prepared for and decisions I made, but also plans that changed, a visa that arrived too late, people who opened doors, and places that became important long after I first arrived in them. The [About page](../about.qmd) has the short version. This is the longer story.

## Ghana: where it began

I studied Accounting at the University of Professional Studies, Accra. It may seem some distance from the work I do now, but I do not think of it as an abandoned beginning. Accounting taught me to pay attention to numbers and organisations, and to the difference between what something appears to be and what the underlying records actually show. It took me years to see how useful that instinct would become.

After university I did my National Service with Ghana's National Petroleum Authority. I had been living in Accra, and the posting sent me to Takoradi, one of the first times life moved me somewhere I had not planned to go. It was also my first real taste of responsibility. I worked nights and double shifts and was trusted with supervisory duties. None of it was glamorous, but it was an education of its own. University had taught me concepts; work began to show me what happens when procedures, rules and decisions meet the people expected to carry them out, and how differently an organisation looks depending on where inside it you stand.

I would not have called that an interest in policy implementation at the time. A few years later, however, the same concern returned as research. One of my early papers, published in [*Resources Policy*](https://doi.org/10.1016/j.resourpol.2023.103368), examined how to measure safety performance in Ghana's oil and gas industry. The subject was different from what I work on now, but the underlying question was already familiar: what happens between a formal system and the people who have to make it work?

## China: a much bigger change than a degree

In 2019 I received a full scholarship for an MSc in Management Science and Engineering and moved to Taiyuan, in northern China. I knew China would be different. I was less prepared for how different the north would feel to someone arriving from Ghana, and the cold introduced itself quickly.

The larger change was intellectual. China was where I became deliberate about policy research. Instead of seeing only a result, I started asking what structure had produced it. Who were the actors? What assumptions sat underneath the analysis, and what counted as evidence? What happened when a policy left a document and entered an economy, an organisation or a community? My interests moved across sustainability, development, environmental policy and energy economics. Energy held my attention because so many of its decisions operate at scale: governments, industries and large companies can change the direction of a whole system, and thinking at that scale taught me to look for the links between institutions, incentives and outcomes.

![With people who became part of my life in China.](images/china-community.jpg){fig-alt="Elvis Kwame Ofori standing outdoors with friends and fellow students during his time in China" width=94% fig-align="center"}

*China became much more than a scholarship or a degree. The people around me became part of the education too.*

Part of my life there never appeared on a transcript. I taught English as a second language, including to young children, and I loved the moment when confusion turned into confidence and something difficult suddenly made sense. Years later I realised that teaching had sharpened a skill research needs too: understanding something yourself is one thing, and explaining it clearly to someone else is another. The same instinct showed up when colleagues needed help with data. I liked sitting down with someone and working through not only which command to run, but what the numbers were saying and whether the interpretation held up. I still think of data analysis almost as a conversation. You learn how to talk to data, and you also have to learn when to stop talking long enough to let the data answer back.

I later began doctoral study in China as well. That path would change, but China had already changed me.

## What moving teaches you

I left Ghana in 2019. I could not have known then that I would not go home again until 2024. Living abroad brought opportunities that changed my life, and it also taught me that mobility is not experienced equally. For some people international travel is mostly a ticket, a passport and a timetable. For others it means visa applications, appointments, waiting and the real possibility that an opportunity will move faster than the paperwork.

I learned this clearly with Germany. I was due to join colleagues at a capacity-building training there. They did not face the same visa requirement; I did. By the time my visa arrived, the training was over. I eventually travelled to Germany, but as a personal trip rather than for the programme that had made the journey necessary. It was hardly a tragedy, but it stayed with me because it showed something that talk of international mobility tends to hide: an opportunity can be equally available on paper and still be much easier for one person to reach than another.

## Ireland: beginning again

Eventually I left the doctoral path I had begun in China and moved to the University of Galway for a different PhD. Before the research groups, conferences and models became part of the story, Ireland was simply somewhere new, and a new country means learning small things all over again: routes, weather, shops, ways of speaking, and the rules nobody explains because everyone else already knows them.

Then the research moved sideways in a way I had not expected. Much of my earlier work was in energy economics, where the important actors were governments, industries and large institutions. Agriculture and land use brought the problem much closer to individual decisions. A government can set a climate target, a model can describe a pathway, and a sector can be told that its emissions must fall. But eventually somebody owns or works the land. Somebody has animals to feed, bills to pay, machinery already bought, a family involved in the farm, or a perfectly good reason for continuing to do something that looks inefficient from far away. That pulled my attention towards farmers, land-use decisions, behavioural responses and the way costs are distributed across people and places. Later, while continuing the PhD, I joined the wider FORESIGHT and FUSION research environment at Galway as a Research Assistant.

![At the Agriculture & Land Use in Ireland conference.](images/agriculture-land-use-conference.jpg){fig-alt="Elvis Kwame Ofori standing with other participants at the Agriculture and Land Use in Ireland conference" width=94% fig-align="center"}

*Research eventually gave me a community as well as a subject.*

The subject had changed a great deal since accounting and my energy work, but the underlying questions had changed less than I first thought. Who makes the decision, and with what information? Which constraints disappear when you look from too far away? Who benefits, and who pays? A national model may say that livestock numbers should fall, that land should change use or that a technology should be adopted. A farmer still has to decide what to do on Monday morning. The distance between the aggregate pathway and that decision has become the part of the work I care about most.

[Read more about my research →](../research/)

Work helps a place become home, but work alone does not make a life. Church, shared meals, friendships and ordinary routines are what turned Ireland from somewhere I had moved for a PhD into somewhere that holds pieces of my life. There have been classmates who became friends, colleagues who patiently explained things I probably should have known, supervisors who trusted me, and people who helped when I was new. A CV is good at recording institutions and much worse at recording people. It records the year you arrived; it does not record who helped make the place feel less strange.

![A sunny day in Galway.](images/galway-life.jpg){fig-alt="Elvis Kwame Ofori standing on a sunny street in Galway wearing headphones" width=68% fig-align="center"}

*Somewhere along the way, a place you moved to for work begins collecting friendships and memories of its own.*

## Beyond the desk

Research has also given me reasons to travel. One trip took me to Washington, D.C., for the World Bank LAND Conference. The programme was the formal reason for going, but a conference is rarely only its programme. There are conversations over coffee, people you did not expect to meet, and a city you had previously known mostly through books and news. In Washington I met other Ghanaians at the conference, a small reminder that home can turn up in unexpected places.

![At the World Bank LAND Conference in Washington, D.C.](images/land-conference.jpg){fig-alt="Elvis Kwame Ofori standing in a conference room at the World Bank LAND Conference in Washington DC" width=68% fig-align="center"}

*The formal programme was one part of the trip. The people and places around it became part of the experience too.*

## Going home

For all the places that became part of my life after 2019, Ghana never stopped being home. I returned for the first time in 2024, five years after leaving, and went back again in 2025. Five years is long enough for absence to become normal. You learn to celebrate some things through a screen, hear family news over the phone and accept that ordinary moments are happening without you. Going home changed the scale of those years.

What mattered was not sightseeing but family: sitting together, talking without watching the time, eating together, being physically present again. Living abroad has given me opportunities I am deeply grateful for, but opportunity and family are not interchangeable. A career can cross borders surprisingly well. Relationships still depend on presence.

## Reading beyond the work

One habit runs through all of these chapters: I love to read. Some books connect directly to my research, and many do not. I like following an argument into a subject I know little about and finding another question waiting there. That is partly why this website is broader than my PhD. Research teaches you to narrow a question until it can be answered properly, and that discipline matters. Curiosity does not always respect project boundaries.

Some posts here will be about agriculture or economics because that is where my research sits. Others will be about science, technology, Ghana, Africa, Ireland, a book, a place or a person. I do not expect them all to fit in one intellectual box. My own route has not.

## Still unfinished

Writing about a journey from the middle of it has an obvious danger. Accidents start to look like plans, decisions gain importance because you already know what came next, and memory quietly rearranges the cast. I do not want this page to become a polished origin story in which accounting inevitably led to China and China inevitably led to Ireland. Some things worked and some plans changed. One visa arrived after the opportunity it was meant for. I walked away from one PhD and began another, places I expected to be temporary became important, and after five years away I went home.

The page is called *How I got here*, but "here" is still moving. I will come back to it when another chapter changes the shape of the story, when memory supplies something I missed, or when I realise I have not thanked somebody properly. For now, this is where I am.
'''
          Path('how-i-got-here/index.qmd').write_text(how)

          # 3. Fold useful planning/evidence routes into the canonical workflow.
          wf = Path('.editorial/EKO_EDITORIAL_WORKFLOW_v2.2.md')
          text = wf.read_text()
          anchor = "Use `.editorial/EKO_ENGINE_LIBRARY.md` when selecting a structure for a new article. It is a menu of possible engines, planning tests and anti-repetition checks, not a mandatory sequence. `.editorial/EKO_TOPIC_BACKLOG.md` is an idea bank only; it does not override weekly planning, current evidence checks or owner approval.\n"
          addition = r'''

## Planning and owner approval

Run this before researching a new week of posts, unless Elvis has already selected a specific topic and asked for a draft.

Plan topics rather than filling a posting quota. Prepare a slate of two to four candidates, drawing on `.editorial/EKO_TOPIC_BACKLOG.md` where useful, and re-check current evidence, policy status, paper-publication status and recent site coverage before reusing any older candidate. For each candidate give only what is needed to decide: the subject or question, why it matters now, what EKO Perspectives can add beyond existing coverage, the likely content route, a provisional engine, and whether it needs first-hand reporting, personal modelling experience, public records or only desk research.

Research sufficient to evaluate a candidate is allowed before approval. Do not start a full draft until Elvis approves the topic or theme. Once approved, the evidence may still change the angle or engine.

Do not compensate for a quiet period by publishing a burst of similar posts. Consistency matters more than volume.
'''
          if '## Planning and owner approval' not in text:
              text = text.replace(anchor, anchor + addition, 1)

          claim_anchor = "## Evidence and claim ledger\n\n"
          claim_add = r'''### Read against the claim

For a substantive argument, identify the strongest credible foil: a competing paper, rebuttal, agency interpretation, trade-body response, court finding, parliamentary objection or another source a knowledgeable critic would actually use. Do not create a weak opponent to make the piece look balanced. A strong claim should survive the strongest reasonable objection available.

### Find the deeper mechanism

Ask whether the visible controversy is actually driven by property or tenure, accounting boundaries, baselines, incentives, measurement, spatial scale, displacement, leakage, implementation capacity or another mechanism. Name it only when the evidence supports it.

### Public-record voices

Named voices can come from Dáil or parliamentary debates, court judgments, consultation submissions, agency records and other public documents. Attribute them accurately. Never imply that Elvis interviewed or personally observed someone when he did not.

### Claim ledger

'''
          if '### Read against the claim' not in text:
              text = text.replace(claim_anchor, claim_anchor + claim_add, 1)

          personal = "### Personal / ideas\nThis is the lightest route, but factual claims still require evidence. Do not invent biographical detail to make the prose more vivid.\n"
          routes = r'''

### Behind the paper / behind the model
Identify the research decision, modelling difficulty, failed assumption, methodological trade-off or surprise that gives the post a reason to exist. Use only public or cleared results, coordinate with co-authors and journal rules, and use first person for real research experience rather than ornament.

### Policy audit / target versus delivery
State exactly what was promised, targeted or claimed; establish the appropriate comparison period; test rather than assume success or failure; identify implementation constraints; and conclude with the degree to which the evidence supports the claim.
'''
          if '### Behind the paper / behind the model' not in text:
              text = text.replace(personal, personal + routes, 1)

          gate_old = "- Confirm that stated opinions are genuinely approved as the author's position and are no stronger than the evidence can support.\n- Confirm the post has at least one relevant lead image, stored locally, with descriptive alt text and any required caption, credit and licence."
          gate_new = "- Confirm that stated opinions are genuinely approved as the author's position and are no stronger than the evidence can support. Elvis must review any clear position written in his voice rather than silently inheriting an editor's or AI draft's opinion.\n- Compare the finished piece with the last several posts. If the same engine, opener, caution move, schematic placement or ending appears again, confirm that the material genuinely requires it.\n- If a scene is used, confirm whether it is first-hand, directly reported or reconstructed from documents, and make sure the prose does not imply more access than actually occurred.\n- Confirm the post has at least one relevant lead image, stored locally, with descriptive alt text and any required caption, credit and licence."
          if gate_old in text:
              text = text.replace(gate_old, gate_new, 1)
          wf.write_text(text)

          # 4. Extend the one canonical engine library rather than creating a second one.
          ep = Path('.editorial/EKO_ENGINE_LIBRARY.md')
          text = ep.read_text()
          marker = "## The four-sentence planning test\n"
          engines = r'''## Further engines

These are less frequent but useful when the material calls for them. A piece may combine two engines if the material genuinely does so.

### 7. Contradiction or foil led

Start with something that appears true, desirable or settled, then introduce the fact that complicates it. The foil must be a real claim, policy assumption, study or documented position, not a vague straw man.

### 8. Mechanism led

Name and explain the mechanism that connects events: displacement, rebound, leakage, lock-in, option value, tenure, accounting boundaries, spatial targeting, behavioural response or another mechanism supported by evidence. Give the plain-language version before any technical label.

### 9. Timeline or policy reversal

Show how rules, incentives or outcomes changed over time. The movement should reveal causation, institutional learning or reversal, not just provide chronology.

### 10. People or places behind the science

Build around a person, a question, the place and people around the work, the method and its consequences, in whatever proportions the story earns. Avoid the lone-genius narrative and explain the central mechanism rather than calling work groundbreaking.

## Choosing an engine

Before drafting, answer privately:

1. What is the most important thing this piece is trying to show?
2. What evidence actually carries that point?
3. What would a well-informed critic say?
4. Is the deeper issue really about land, or about measurement, ownership, accounting, incentives, spatial scale or implementation?
5. Which engine lets that evidence unfold with the least forcing?

If no engine can be named without distorting the evidence, do not name one. Write the piece naturally.

'''
          if '### 7. Contradiction or foil led' not in text:
              text = text.replace(marker, engines + marker, 1)

          exemplar = r'''

## Studying exemplars

Older E360 features, research blogs, academic op-eds, trade press, journal papers and classic essays are useful for studying architecture. There is no single E360 framework: reported features, opinion columns, research blogs, interviews and journal articles use different engines.

When studying a reference piece, outline what the writer does rather than how the sentences sound, read a strong rebuttal or competing interpretation where one exists, note what evidence carries the argument, and ask what would fail if the opening device were copied onto a different subject. Never reuse distinctive phrases or imitate one living writer's voice.

Some examples collected while developing this workflow were read only through abstracts, excerpts or secondary accounts. Treat them as reading leads until the original has been reread, and do not encode an unverified summary as a permanent house rule.
'''
          if '## Studying exemplars' not in text:
              text = text.rstrip() + exemplar + '\n'
          ep.write_text(text)

          # 5. Keep the backlog as the single place for site-maintenance decisions.
          bp = Path('.editorial/EKO_TOPIC_BACKLOG.md')
          text = bp.read_text()
          todo = r'''

## Site to-do

Maintenance items from the same review, in rough priority order. None of them is a publication task.

1. Add a "Working papers" section to the Research page as papers become public.
2. Consider moving the FUSION/FORESIGHT disclosure from the blog into a Research context page linked from About and Research.
3. Replace the hand-coded Featured block on the homepage with a Quarto listing filtered on `featured: true` when technically convenient.
4. Decide deliberately whether Editorial standards needs a concise AI-assistance line. Do not add one automatically.
5. Add a non-university contact address that will outlast the PhD.
6. Fill remaining gaps on How I got here only with details Elvis chooses to share: the Taiyuan university, the scholarship, and named people with their permission.
'''
          if '## Site to-do' not in text:
              text = text.rstrip() + todo + '\n'
          bp.write_text(text)
          PY

      - name: Guardrails
        run: |
          ! grep -R "<!-- EKO:" -n blog how-i-got-here about.qmd research .editorial
          ! grep -R "—" -n blog/posts/2026-09-22-acres-landscape-actions/index.qmd blog/posts/2026-09-22-ai-needs-evidence-not-anecdotes/index.qmd blog/posts/2026-09-24-wildfire-policy-before-fire/index.qmd how-i-got-here/index.qmd .editorial/EKO_EDITORIAL_WORKFLOW_v2.2.md .editorial/EKO_ENGINE_LIBRARY.md .editorial/EKO_TOPIC_BACKLOG.md

      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .editorial/EKO_EDITORIAL_WORKFLOW_v2.2.md .editorial/EKO_ENGINE_LIBRARY.md .editorial/EKO_TOPIC_BACKLOG.md
          git add blog/posts/2026-09-22-acres-landscape-actions/index.qmd
          git add blog/posts/2026-09-22-ai-needs-evidence-not-anecdotes/index.qmd
          git add blog/posts/2026-09-24-wildfire-policy-before-fire/index.qmd
          git add how-i-got-here/index.qmd
          git commit -m "Consolidate EKO voice and editorial system"
          git push origin HEAD:eko-final-consolidation
