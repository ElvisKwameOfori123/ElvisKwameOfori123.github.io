name: Localize credited EKO lead images (one-time branch)
on:
  push:
    branches:
      - fix/local-lead-images-and-seo-20261025
    paths:
      - scripts/localize-lead-images-once.py
      - .github/workflows/localize-lead-images-once.yml
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pillow>=11,<13"
      - name: Download, validate and relink existing licensed photographs
        run: python scripts/localize-lead-images-once.py
      - name: Commit licensed local assets to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts/2026-10-22-cop17-biodiversity-connectivity blog/posts/2026-10-21-american-farmers-livelihoods blog/posts/2026-10-21-why-american-farmers-work-off-farm
          if ! git diff --cached --quiet; then
            git commit -m "Archive three credited article lead photographs locally"
            git push origin HEAD:fix/local-lead-images-and-seo-20261025
          fi
