project:
  type: website
  output-dir: _site
  resources:
    - CNAME

website:
  title: "Elvis Kwame Ofori"
  description: "Personal writing on policy, science, economics, technology, Ghana, Ireland, the United States, and research."
  site-url: "https://kwameofori123.com"
  repo-url: "https://github.com/ElvisKwameOfori123/ElvisKwameOfori123.github.io"
  favicon: assets/favicon.svg
  image: /assets/profile.jpg
  image-alt: "Elvis Kwame Ofori"
  open-graph: true
  twitter-card: true
  llms-txt: true
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    left:
      - text: Writing
        href: blog/index.qmd
      - text: About
        href: about.qmd
      - text: Research
        href: research/index.qmd
      - text: Contact
        href: contact.qmd
    right:
      - icon: github
        href: "https://github.com/ElvisKwameOfori123"
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/elvis-ofori-12139b71/"
        aria-label: LinkedIn
      - icon: rss
        href: "/blog/index.xml"
        aria-label: RSS
  page-footer:
    left: "© Elvis Kwame Ofori"
    center: "Views are my own · [RSS](/blog/index.xml)"
    right: "[Email](mailto:e.ofori1@universityofgalway.ie) · [ORCID](https://orcid.org/0000-0001-5404-9078) · [Scholar](https://scholar.google.com/citations?user=cf5X1eAAAAAJ&hl=en)"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles-common.css
    include-in-header: includes/head.html
    canonical-url: true
    grid:
      body-width: 900px
      margin-width: 220px
    toc: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
