project:
  type: website
  output-dir: _site
  post-render:
    - scripts/remove-draft-output.py
    - scripts/normalize-sitemap.py
    - scripts/inject-structured-data.py
    - scripts/normalize-internal-links.py
    - scripts/optimize-rendered-pages.py
  resources:
    - CNAME
    - google63dfd647cad8477d.html

website:
  title: "EKO Perspectives"
  description: "Research, evidence and ideas on policy, agriculture, land use, economics, science, technology and development."
  site-url: "https://kwameofori123.com"
  repo-url: "https://github.com/ElvisKwameOfori123/ElvisKwameOfori123.github.io"
  favicon: assets/favicon.svg
  image: /assets/profile.jpg
  image-alt: "Elvis Kwame Ofori"
  open-graph: true
  twitter-card: true
  llms-txt: true
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    left:
      - text: Home
        href: index.qmd
      - text: Writing
        href: blog/index.qmd
      - text: Research
        href: research/index.qmd
      - text: About
        href: about.qmd
  page-footer:
    left: "© Elvis Kwame Ofori · Views are my own"
    center: "[Contact](/contact.html) · [Privacy](/privacy.html) · [Copyright & reuse](/copyright.html) · [Accessibility](/accessibility.html) · [Editorial standards](/about.html#editorial-standards)"
    right: "[GitHub](https://github.com/ElvisKwameOfori123) · [LinkedIn](https://www.linkedin.com/in/elvis-ofori-12139b71/) · [ORCID](https://orcid.org/0000-0001-5404-9078) · [Scholar](https://scholar.google.com/citations?user=cf5X1eAAAAAJ&hl=en) · [RSS](/blog/index.xml)"

format:
  html:
    theme:
      dark: [darkly, theme-dark.scss]
      light: [cosmo, theme-light.scss]
    css: styles-common.css
    include-in-header: includes/head.html
    canonical-url: true
    html-math-method: plain
    grid:
      body-width: 900px
      margin-width: 220px
    toc: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
