project:
  type: website
  output-dir: _site
  resources:
    - preview-v2/**
    - theme-lab/**

website:
  title: "Elvis Kwame Ofori"
  description: "Research, models, projects and writing by Elvis Kwame Ofori."
  site-url: "https://ElvisKwameOfori123.github.io"
  repo-url: "https://github.com/ElvisKwameOfori123/ElvisKwameOfori123.github.io"
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    left:
      - text: Research
        href: research/index.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Publications
        href: publications/index.qmd
      - text: Talks
        href: talks/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: "https://github.com/ElvisKwameOfori123"
        aria-label: GitHub
      - text: ORCID
        href: "https://orcid.org/0000-0001-5404-9078"
        aria-label: ORCID
      - icon: linkedin
        href: "https://www.linkedin.com/in/elvis-ofori-12139b71/"
        aria-label: LinkedIn
  page-footer:
    left: "© Elvis Kwame Ofori"
    center: "University of Galway · Ryan Institute"
    right: "[GitHub](https://github.com/ElvisKwameOfori123) · [ORCID](https://orcid.org/0000-0001-5404-9078)"

format:
  html:
    theme:
      - styles.scss
    grid:
      body-width: 900px
      margin-width: 220px
    toc: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
