project:
  type: website
  output-dir: _site

website:
  title: "Elvis Kwame Ofori"
  description: "Agricultural, land-use, bioenergy and policy modelling; reproducible research; projects and writing by Elvis Kwame Ofori."
  site-url: "https://ElvisKwameOfori123.github.io"
  repo-url: "https://github.com/ElvisKwameOfori123/ElvisKwameOfori123.github.io"
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: research/index.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Publications
        href: publications/index.qmd
      - text: Talks
        href: talks/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: "https://github.com/ElvisKwameOfori123"
        aria-label: GitHub
      - icon: rss
        href: blog/index.xml
        aria-label: RSS
  page-footer:
    left: "© Elvis Kwame Ofori"
    center: "University of Galway · Ryan Institute"
    right: "Built with Quarto · Source on GitHub"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
